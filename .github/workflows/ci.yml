name: CI

on:
  pull_request:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check src tests scripts

  typecheck:
    runs-on: ubuntu-latest
    # continue-on-error, not a real gate yet: this codebase has never been
    # type-checked (no mypy/pyright config anywhere before this workflow),
    # so a hard-fail gate on day one would fail on pre-existing code, not
    # anything this change introduced. This job exists to make the real
    # error count visible in every PR/push from now on — once someone has
    # looked at that number and it's driven down (or annotated away) to
    # something intentional, remove continue-on-error to make it a real
    # gate rather than inventing a threshold now with no baseline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy
        run: pip install mypy
      - name: mypy (report-only)
        run: mypy src/monkey_brain --config-file pyproject.toml || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov pytest-timeout
      - name: Run test suite with coverage
        env:
          ACCESS_TOKEN_SECRET: ci-test-access-token-secret
          REFRESH_TOKEN_SECRET: ci-test-refresh-token-secret
          API_GATEWAY_REQUIRED: "false"
          AGENTOS_AUTH_REQUIRED: "false"
        # Curated regression bundle (~3 min): architecture waves, production
        # gates, gateway boundary, idempotency, world validator, and fast
        # scale tiers. Full suite (4000+ tests) is local/optional; scenarios
        # and integration paths run in architecture-conformance.yml.
        run: |
          python -m pytest -q \
            tests/test_kernel_runtime_registry_wave1.py \
            tests/test_wave2_actor_architecture.py \
            tests/test_wave3_planetary_world_convergence.py \
            tests/test_wave5_execution_architecture.py \
            tests/test_wave6_architecture_certification.py \
            tests/unit/test_world_validator.py \
            tests/unit/test_idempotency.py \
            tests/unit/test_gateway_models_commerce.py \
            tests/unit/test_api_gateway_boundary.py \
            tests/unit/test_internal_auth.py \
            tests/unit/test_cognitive_kernel.py \
            tests/unit/test_gateway_e2e.py \
            tests/unit/test_production_gates.py \
            tests/unit/test_multi_replica_safety.py \
            tests/scenarios/test_gate3_world_validation.py \
            tests/scale/test_actor_scale.py \
            --timeout=120 \
            --cov=src --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  actor-artifact-build:
    # Actor Artifact model (docs/ACTOR_ARTIFACT.md): verifies the shared
    # monkeybrain/agentos image -- which packages BOTH the Society
    # control-plane server AND the canonical Actor Runtime
    # (src/monkey_brain/actor_runtime.py), selected only by container
    # `command:` -- still builds cleanly, and computes/exposes a
    # deterministic artifact version tag. Deliberately BUILD ONLY: no
    # `docker push`, no registry credentials needed, and no deployment
    # step -- source -> tests -> artifact -> version is a separate,
    # explicit concern from "an Actor gets deployed" (Section 21: "do
    # not automatically deploy an Actor merely because an image was
    # built").
    #
    # continue-on-error, same "not a real gate yet" precedent this
    # workflow's own typecheck job already established: this is the
    # FIRST CI job to build this image at all, so a hard-fail gate on
    # day one could fail for reasons unrelated to any specific change
    # (base image pull flakiness, an environment difference from local
    # `docker build`, never previously exercised in CI). Once this has
    # run cleanly on main a few times, remove continue-on-error to make
    # it a real gate.
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Compute Actor Artifact version
        id: version
        run: |
          SHORT_SHA="${GITHUB_SHA:0:12}"
          echo "artifact_version=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Actor Artifact version: ${SHORT_SHA} (source revision ${GITHUB_SHA})"
      - name: Build Actor Artifact image (no push)
        run: |
          docker build \
            -f docker/services/agentos/Dockerfile \
            -t cognitiveos-actor:${{ steps.version.outputs.artifact_version }} \
            .
      - name: Verify canonical Actor Runtime entrypoint is importable
        # Cheap, real smoke check distinct from pytest's own coverage:
        # confirms the image actually contains a working
        # src.monkey_brain.actor_runtime:app target before anything ever
        # tries to `docker run ... command: [... actor_runtime:app]`
        # against it (deploy/k8s/actor-deployment.yaml,
        # docker-compose.actors.yml).
        run: |
          docker run --rm cognitiveos-actor:${{ steps.version.outputs.artifact_version }} \
            python -c "import src.monkey_brain.actor_runtime as m; print('ACTOR_RUNTIME_VERSION=' + m.ACTOR_RUNTIME_VERSION)"
      - name: Security gate — verify no secrets in Actor Artifact image
        # Security assertion: rejects image if .env, keys, credentials, or
        # other secrets are present. This prevents accidental leaks of local
        # configuration or credentials into container images.
        #
        # Related: .dockerignore (primary control), .gitignore (keeps in sync)
        run: |
          python scripts/verify_image_secrets.py cognitiveos-actor:${{ steps.version.outputs.artifact_version }}

  docker-image-security-gates:
    # Comprehensive security checks for all Docker images built from service
    # Dockerfiles. Verifies that no .env files, key material, credentials,
    # or other secrets are embedded in the images before they can be pushed
    # or deployed.
    #
    # This gate scans multiple services to catch accidental secrets anywhere
    # in the build context, not just the canonical Actor Artifact.
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true
    strategy:
      matrix:
        dockerfile:
          - docker/services/auth/Dockerfile
          - docker/services/file/Dockerfile
          - docker/services/agentos/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Extract service name from Dockerfile
        id: service
        run: |
          SERVICE=$(echo "${{ matrix.dockerfile }}" | grep -oP 'services/\K[^/]+' || echo "unknown")
          IMAGE_TAG="monkeybrain-${SERVICE}:ci-${GITHUB_SHA:0:12}"
          echo "service=${SERVICE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
      - name: Build service image
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t ${{ steps.service.outputs.image_tag }} \
            .
      - name: Security gate — verify no secrets in ${{ steps.service.outputs.service }} image
        run: |
          python scripts/verify_image_secrets.py ${{ steps.service.outputs.image_tag }}
