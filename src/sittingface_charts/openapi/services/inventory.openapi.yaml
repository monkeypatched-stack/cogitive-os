    InventoryItemCreate:
      properties:
        sku:
          type: string
          maxLength: 50
          minLength: 3
          title: Sku
          description: Stock Keeping Unit. Unique alphanumeric identifier.
        name:
          type: string
          minLength: 1
          title: Name
          description: Name of the inventory item.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Detailed product description.
        category:
          type: string
          title: Category
          description: Product category (e.g., Raw Materials, Electronics, Packaging).
        warehouse_id:
          type: string
          title: Warehouse Id
          description: ID of the physical warehouse holding this stock.
        bin_location:
          anyOf:
          - type: string
          - type: 'null'
          title: Bin Location
          description: Specific aisle/shelf/bin location within the warehouse.
        quantity_on_hand:
          type: integer
          minimum: 0.0
          title: Quantity On Hand
          description: Physical inventory currently present in the warehouse.
          default: 0
        quantity_allocated:
          type: integer
          minimum: 0.0
          title: Quantity Allocated
          description: Stock reserved for pending customer orders.
          default: 0
        quantity_available:
          type: integer
          minimum: 0.0
          title: Quantity Available
          description: Net stock available for new orders (On Hand - Allocated).
          default: 0
        reorder_point:
          type: integer
          minimum: 0.0
          title: Reorder Point
          description: Minimum stock level that triggers an automatic reorder alert.
        max_stock_level:
          type: integer
          minimum: 1.0
          title: Max Stock Level
          description: Maximum storage capacity for this item to prevent overstocking.
        lead_time_days:
          type: integer
          minimum: 0.0
          title: Lead Time Days
          description: Average days required to receive stock from the supplier after
            ordering.
          default: 14
        cost_price:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Cost Price
          description: Unit cost paid to the supplier.
        retail_price:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Retail Price
          description: Standard selling price to consumers.
        currency:
          type: string
          maxLength: 3
          minLength: 3
          title: Currency
          description: Three-letter ISO currency code.
          default: USD
        supplier_id:
          type: string
          title: Supplier Id
          description: Associated supplier ID managing this capability/product.
        is_active:
          type: boolean
          title: Is Active
          description: Indicates if the item is actively being sold or ordered.
          default: true
        requires_inspection:
          type: boolean
          title: Requires Inspection
          description: Flag for whether incoming stock needs Quality Assurance testing.
          default: false
        last_counted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Counted At
          description: Timestamp of the last physical inventory audit/cycle count.
      type: object
      required:
      - sku
      - name
      - category
      - warehouse_id
      - reorder_point
      - max_stock_level
      - cost_price
      - retail_price
      - supplier_id
      title: InventoryItemCreate
      description: Schema for POST requests to create inventory.
