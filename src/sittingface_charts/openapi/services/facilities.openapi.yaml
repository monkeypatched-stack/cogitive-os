components:
  schemas:
    CalibrationPoint:
      properties:
        reference_value:
          type: number
          title: Reference Value
        measured_value:
          type: number
          title: Measured Value
        unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
        deviation:
          anyOf:
          - type: number
          - type: 'null'
          title: Deviation
      type: object
      required:
      - reference_value
      - measured_value
      title: CalibrationPoint
    CalibrationRecord:
      properties:
        record_id:
          type: string
          minLength: 1
          title: Record Id
        equipment_id:
          type: string
          minLength: 1
          title: Equipment Id
        work_order_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Work Order Id
        instrument_tag:
          anyOf:
          - type: string
          - type: 'null'
          title: Instrument Tag
        instrument_range:
          anyOf:
          - type: string
          - type: 'null'
          title: Instrument Range
        instrument_resolution:
          anyOf:
          - type: string
          - type: 'null'
          title: Instrument Resolution
        calibration_type:
          type: string
          enum:
          - Routine
          - Post-Repair
          - Validation
          - Verification
          - Emergency
          title: Calibration Type
        status:
          type: string
          enum:
          - Scheduled
          - In Progress
          - Completed
          - Passed
          - Failed
          - Overdue
          - Cancelled
          title: Status
          default: Scheduled
        standard_used:
          type: string
          enum:
          - NIST
          - ISO 17025
          - USP
          - EP
          - In-House
          - OEM
          - Other
          title: Standard Used
          default: In-House
        certificate_no:
          anyOf:
          - type: string
          - type: 'null'
          title: Certificate No
        scheduled_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Scheduled Date
        performed_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Performed Date
        next_due_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Next Due Date
        calibration_interval_days:
