openapi: 3.1.0
info:
  title: auth API
  description: MonkeyBrain auth service API
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login
      description: 'Authenticate with email + password.

        Accepts both JSON body and form-urlencoded (OAuth2 compatibility).

        Returns a short-lived access token in the body and sets an

        httpOnly refresh token cookie.'
      operationId: login_api_v1_auth_login_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh
      operationId: refresh_api_v1_auth_refresh_post
      parameters:
      - name: refreshToken
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Refreshtoken
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RefreshTokenRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
