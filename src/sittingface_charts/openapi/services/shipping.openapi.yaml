            $ref: '#/components/schemas/CarrierContact'
          type: array
          title: Contacts
        insurance_policy_number:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Insurance Policy Number
        insurance_expiry:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Insurance Expiry
        contract_reference:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Contract Reference
        active:
          type: boolean
          title: Active
          default: true
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
      type: object
      required:
      - name
      - code
      - address
      title: CarrierCreate
