components:
  schemas:
    Address:
      properties:
        line1:
          type: string
          maxLength: 200
          minLength: 1
          title: Line1
        line2:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Line2
        city:
          type: string
          maxLength: 100
          minLength: 1
          title: City
        state:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: State
        postal_code:
          anyOf:
          - type: string
            maxLength: 30
          - type: 'null'
          title: Postal Code
        country:
          type: string
          maxLength: 100
          minLength: 1
          title: Country
      type: object
      required:
      - line1
      - city
      - country
      title: Address
    CarrierContact:
      properties:
        name:
          type: string
          maxLength: 150
          minLength: 1
          title: Name
        role:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Role
          examples:
          - Dispatcher
          - Account Manager
        phone:
          type: string
          maxLength: 30
          title: Phone
        email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Email
      type: object
      required:
      - name
      - phone
      title: CarrierContact
    CarrierCreate:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        code:
          type: string
          maxLength: 20
          minLength: 1
          title: Code
          description: Internal carrier code
        transport_mode:
          $ref: '#/components/schemas/CarrierMode'
          default: road
        scac_code:
          anyOf:
          - type: string
            maxLength: 4
          - type: 'null'
          title: Scac Code
          description: Standard Carrier Alpha Code (SCAC) - North America
        tax_id:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Tax Id
        address:
          $ref: '#/components/schemas/Address'
        contacts:
