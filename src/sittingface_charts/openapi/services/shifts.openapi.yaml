components:
  schemas:
    BreakPeriod-Input:
      properties:
        break_start:
          type: string
          format: time
          title: Break Start
        break_end:
          type: string
          format: time
          title: Break End
        paid:
          type: boolean
          title: Paid
          default: false
        reason:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Reason
          examples:
          - Lunch
          - Short break
      type: object
      required:
      - break_start
      - break_end
      title: BreakPeriod
      description: A single break within a shift.
    BreakPeriod-Output:
      properties:
        break_start:
          type: string
          format: time
          title: Break Start
        break_end:
          type: string
          format: time
          title: Break End
        paid:
          type: boolean
          title: Paid
          default: false
        reason:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Reason
          examples:
          - Lunch
          - Short break
        duration_minutes:
          type: integer
          title: Duration Minutes
          readOnly: true
      type: object
      required:
      - break_start
      - break_end
      - duration_minutes
      title: BreakPeriod
      description: A single break within a shift.
    BreakSlot-Input:
      properties:
        label:
          type: string
          title: Label
          examples:
          - Lunch
          - Tea Break
        time_range:
          $ref: '#/components/schemas/TimeRange-Input'
        paid:
          type: boolean
          title: Paid
          default: false
      type: object
      required:
      - label
      - time_range
      title: BreakSlot
      description: A scheduled break within a shift.
    BreakSlot-Output:
      properties:
        label:
          type: string
          title: Label
          examples:
          - Lunch
          - Tea Break
        time_range:
          $ref: '#/components/schemas/TimeRange-Output'
        paid:
          type: boolean
          title: Paid
          default: false
      type: object
      required:
      - label
      - time_range
      title: BreakSlot
      description: A scheduled break within a shift.
    DayOfWeek:
      type: string
      enum:
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
      - sunday
      title: DayOfWeek
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PaginatedShiftScheduleResponse:
      properties:
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        page_size:
          type: integer
          title: Page Size
        results:
          items:
            $ref: '#/components/schemas/ShiftScheduleResponse'
          type: array
          title: Results
      type: object
      required:
      - total
      - page
      - page_size
      - results
      title: PaginatedShiftScheduleResponse
    PaginatedShiftTemplateResponse:
      properties:
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        page_size:
          type: integer
          title: Page Size
        results:
          items:
            $ref: '#/components/schemas/ShiftTemplateResponse'
          type: array
          title: Results
      type: object
      required:
      - total
      - page
      - page_size
      - results
      title: PaginatedShiftTemplateResponse
    PaginatedTimeSheetResponse:
      properties:
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        page_size:
          type: integer
          title: Page Size
        results:
          items:
            $ref: '#/components/schemas/TimeSheetResponse'
          type: array
          title: Results
      type: object
      required:
      - total
      - page
      - page_size
      - results
      title: PaginatedTimeSheetResponse
    ShiftScheduleCreate:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        plant_id:
          type: string
          title: Plant Id
        template_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Template Id
          description: Source ShiftTemplate, if generated from one
        shift_date:
          type: string
          format: date
          title: Shift Date
        shift_type:
          $ref: '#/components/schemas/ShiftType'
        time_range:
          $ref: '#/components/schemas/TimeRange-Input'
        supervisor_id:
          type: string
          format: uuid
          title: Supervisor Id
          description: Responsible supervisor employee id
        employee_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Employee Ids
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - plant_id
      - shift_date
      - shift_type
      - time_range
      - supervisor_id
      title: ShiftScheduleCreate
    ShiftScheduleResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        plant_id:
          type: string
          title: Plant Id
        template_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Template Id
          description: Source ShiftTemplate, if generated from one
        shift_date:
          type: string
          format: date
          title: Shift Date
        shift_type:
          $ref: '#/components/schemas/ShiftType'
        time_range:
          $ref: '#/components/schemas/TimeRange-Output'
        supervisor_id:
          type: string
          format: uuid
          title: Supervisor Id
          description: Responsible supervisor employee id
        employee_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Employee Ids
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        headcount:
          type: integer
          title: Headcount
          readOnly: true
      type: object
      required:
      - plant_id
      - shift_date
      - shift_type
      - time_range
      - supervisor_id
      - headcount
      title: ShiftScheduleResponse
    ShiftScheduleUpdate:
      properties:
        plant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Plant Id
        template_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Template Id
        shift_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Shift Date
        shift_type:
          anyOf:
          - $ref: '#/components/schemas/ShiftType'
          - type: 'null'
        time_range:
          anyOf:
          - $ref: '#/components/schemas/TimeRange-Input'
          - type: 'null'
        supervisor_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Supervisor Id
        employee_ids:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
          title: Employee Ids
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      title: ShiftScheduleUpdate
    ShiftTemplateCreate:
      properties:
        id:
          type: string
          title: Id
        plant_id:
          type: string
          title: Plant Id
        name:
          type: string
          maxLength: 80
          minLength: 2
          title: Name
        shift_type:
          $ref: '#/components/schemas/ShiftType'
        time_range:
          $ref: '#/components/schemas/TimeRange-Input'
        days:
          items:
            $ref: '#/components/schemas/DayOfWeek'
          type: array
          minItems: 1
          title: Days
        breaks:
          items:
            $ref: '#/components/schemas/BreakSlot-Input'
          type: array
          title: Breaks
        color_hex:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          title: Color Hex
          description: UI colour for calendar views
          default: '#3B82F6'
      type: object
      required:
      - plant_id
      - name
      - shift_type
      - time_range
      - days
      title: ShiftTemplateCreate
    ShiftTemplateResponse:
      properties:
        id:
          type: string
          title: Id
        plant_id:
          type: string
