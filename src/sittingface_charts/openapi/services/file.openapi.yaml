  /url/presigned-url/preview:
    get:
      tags:
      - Files
      summary: Generate Preview Presigned Url
      description: 'Generate a presigned URL for **previewing** an S3 object in the
        browser.


        Example:

        GET /presigned-url/preview?key=uploads/2025-11-21/file.pdf&expires_in=300'
      operationId: generate_preview_presigned_url_url_presigned_url_preview_get
      parameters:
      - name: key
        in: query
        required: true
        schema:
          type: string
          description: S3 object key (e.g. uploads/2025-11-21/file.pdf)
          title: Key
        description: S3 object key (e.g. uploads/2025-11-21/file.pdf)
      - name: expires_in
        in: query
        required: false
        schema:
          type: integer
          maximum: 3600
          minimum: 1
          description: "Expiry time in seconds (1\u20133600)"
          default: 300
          title: Expires In
        description: "Expiry time in seconds (1\u20133600)"
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /url/presigned-url/download:
    get:
      tags:
      - Files
      summary: Generate Download Presigned Url
      description: 'Generate a presigned URL for **downloading** an S3 object.


        Example:

        GET /presigned-url/download?key=uploads/2025-11-21/file.pdf&filename=invoice-123.pdf'
      operationId: generate_download_presigned_url_url_presigned_url_download_get
      parameters:
      - name: key
        in: query
        required: true
        schema:
          type: string
          description: S3 object key (e.g. uploads/2025-11-21/file.pdf)
          title: Key
        description: S3 object key (e.g. uploads/2025-11-21/file.pdf)
      - name: expires_in
        in: query
        required: false
        schema:
          type: integer
          maximum: 3600
          minimum: 1
          description: "Expiry time in seconds (1\u20133600)"
          default: 300
          title: Expires In
        description: "Expiry time in seconds (1\u20133600)"
      - name: filename
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional filename to suggest in the browser download dialog
          title: Filename
        description: Optional filename to suggest in the browser download dialog
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
