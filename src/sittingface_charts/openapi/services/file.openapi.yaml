openapi: 3.1.0
info:
  title: file API
  description: MonkeyBrain file service API
  version: 1.0.0
paths:
  /files/upload/:
    post:
      tags:
      - Files
      summary: Upload File
      description: 'Upload a document to S3 and optionally forward it to another service
        via HTTP POST.

        Folder structure: uploads/YYYY-MM-DD/<uuid>.<ext>'
      operationId: upload_file_files_upload__post
      parameters:
      - name: notify
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Notify
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_file_files_upload__post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /files/upload:
    post:
      tags:
      - Files
      summary: Upload File
      description: 'Upload a document to S3 and optionally forward it to another service
        via HTTP POST.

        Folder structure: uploads/YYYY-MM-DD/<uuid>.<ext>'
      operationId: upload_file_files_upload_post
      parameters:
      - name: notify
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Notify
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_file_files_upload_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /files/{date}:
    get:
      tags:
      - Files
      summary: List Files By Date
      description: 'List all files uploaded on a given date with backup status.

        Example: GET /files/2025-11-11'
      operationId: list_files_by_date_files__date__get
      parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          title: Date
      - name: create_backup
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Create Backup
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Files
      summary: Delete Folder
      description: Delete all files for a specific date (entire folder).
      operationId: delete_folder_files__date__delete
      parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          title: Date
      - name: delete_backup
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Delete Backup
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /files/{date}/{filename}:
    get:
      tags:
      - Files
      summary: Read File
      description: 'Read or download a file from S3 given its date and filename.

        URL format: /files/YYYY-MM-DD/<filename>'
      operationId: read_file_files__date___filename__get
      parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          title: Date
      - name: filename
        in: path
        required: true
        schema:
          type: string
          title: Filename
      - name: download
        in: query
        required: false
        schema:
          type: boolean
          description: Return as browser download attachment when true
          default: true
          title: Download
        description: Return as browser download attachment when true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Files
      summary: Delete File
      description: Delete a file from S3 and optionally its backup.
      operationId: delete_file_files__date___filename__delete
      parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          title: Date
      - name: filename
        in: path
        required: true
        schema:
          type: string
          title: Filename
      - name: delete_backup
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Delete Backup
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /upload/:
    post:
      tags:
      - Files
      summary: Upload File
      description: 'Upload a document to S3 and optionally forward it to another service
        via HTTP POST.

        Folder structure: uploads/YYYY-MM-DD/<uuid>.<ext>'
      operationId: upload_file_upload__post
      parameters:
      - name: notify
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Notify
      requestBody:
        required: true
        content:
