components:
  schemas:
    CertificationCreate:
      properties:
        supplier_id:
          type: string
          title: Supplier Id
          description: Unique identifier for the supplier.
        certification_name:
          type: string
          title: Certification Name
          description: Name of the certification or standard achieved by the supplier.
        certification_type:
          type: string
          title: Certification Type
          description: Type of certification, for example Quality, Environmental,
            Safety, or Industry-Specific.
        issuing_authority:
          type: string
          title: Issuing Authority
          description: Organization or authority that issued the certification.
        certification_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Certification Number
          description: Unique identification number for the certification, if applicable.
        issue_date:
          type: string
          format: date-time
          title: Issue Date
          description: Date on which the certification was issued.
        expiry_date:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expiry Date
        renewal_required:
          type: boolean
          title: Renewal Required
          description: Indicates if the certification requires periodic renewal.
        renewal_frequency:
          anyOf:
          - type: string
          - type: 'null'
          title: Renewal Frequency
          description: How often the certification must be renewed, for example Annual
            or Every 3 Years.
        scope_of_certification:
          type: string
          title: Scope Of Certification
          description: Description of the areas or processes covered by the certification.
        audit_required:
          type: boolean
          title: Audit Required
          description: Indicates if regular audits are required to maintain the certification.
        last_audit_date:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Audit Date
        next_audit_date:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Next Audit Date
        certification_status:
          type: string
          title: Certification Status
          description: Current status of the certification, for example Active, Pending
            Renewal, or Expired.
        certificate_document:
          anyOf:
          - type: string
          - type: 'null'
