    SupplierPricingCreate:
      properties:
        supplier_id:
          type: string
          title: Supplier Id
          description: Unique identifier for the supplier.
        item_id:
          type: string
          title: Item Id
          description: Unique identifier for the inventory item.
        location_id:
          type: string
          title: Location Id
          description: Unique identifier for the supplier's specific location.
        item_name:
          type: string
          title: Item Name
          description: Name or description of the item.
        unit_price:
          type: number
          title: Unit Price
          description: Price per unit of the item.
        currency:
          type: string
          title: Currency
          description: Currency in which the price is quoted.
        pricing_tier:
          type: string
          title: Pricing Tier
          description: Price category based on order volume, for example Bulk, Standard,
            or Wholesale.
        discount_rate:
          type: number
          title: Discount Rate
          description: Discount percentage for bulk purchases or special agreements.
        net_unit_price:
          type: number
          title: Net Unit Price
          description: Final price per unit after applying any discounts.
        quantity_range:
          type: string
          title: Quantity Range
          description: Range of quantities applicable for the specific pricing tier.
        pricing_validity_start:
          type: string
          format: date-time
          title: Pricing Validity Start
          description: Start datetime for the validity of the quoted price.
        pricing_validity_end:
          type: string
          format: date-time
          title: Pricing Validity End
          description: End datetime for the validity of the quoted price.
        price_adjustment_terms:
          type: string
          title: Price Adjustment Terms
          description: Terms for adjusting prices due to inflation, raw material costs,
            etc.
        tax_rate:
          type: number
          title: Tax Rate
          description: Applicable tax percentage for the item.
        tax_amount:
          type: number
          title: Tax Amount
          description: Calculated tax amount per unit.
        total_unit_cost:
          type: number
          title: Total Unit Cost
          description: Unit price including taxes.
        shipping_cost_per_unit:
          type: number
          title: Shipping Cost Per Unit
          description: Estimated or actual shipping cost per unit.
        total_landed_cost:
          type: number
          title: Total Landed Cost
          description: Total cost per unit including price, taxes, and shipping.
        payment_terms:
          type: string
          title: Payment Terms
          description: Terms of payment specific to pricing agreements, for example
            Net 30 or Advance Payment.
        minimum_order_quantity:
          type: integer
          title: Minimum Order Quantity
          description: Minimum quantity required for purchase at the specified price.
        price_escalation_clause:
          anyOf:
          - type: string
          - type: 'null'
          title: Price Escalation Clause
          description: Conditions under which price increases are allowed.
        currency_exchange_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: Currency Exchange Rate
          description: Exchange rate if pricing is in a foreign currency.
        custom_pricing_notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Custom Pricing Notes
          description: Additional notes or special agreements regarding pricing.
      type: object
      required:
      - supplier_id
      - item_id
      - location_id
      - item_name
      - unit_price
      - currency
      - pricing_tier
      - discount_rate
      - net_unit_price
      - quantity_range
