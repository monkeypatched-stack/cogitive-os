    SupplierQualityCreate:
      properties:
        supplier_id:
          type: string
          title: Supplier Id
          description: Unique identifier for the supplier.
        item_id:
          type: string
          title: Item Id
          description: Unique identifier for the inventory item.
        location_id:
          type: string
          title: Location Id
          description: Unique identifier for the supplier's specific location.
        quality_rating:
          type: number
          title: Quality Rating
          description: Overall quality score based on historical performance, for
            example 1 to 100.
        defect_rate:
          type: number
          title: Defect Rate
          description: Percentage of defective items in delivered goods.
        on_time_delivery_rate:
          type: number
          title: On Time Delivery Rate
          description: Percentage of orders delivered on or before the agreed-upon
            date.
        return_rate:
          type: number
          title: Return Rate
          description: Percentage of delivered goods returned due to quality issues.
        non_conformance_reports:
          type: integer
          title: Non Conformance Reports
          description: Number of non-conformance reports filed against the supplier.
        iso_certifications:
          items:
            type: string
          type: array
          title: Iso Certifications
          description: List of ISO or equivalent certifications related to quality
            management.
        quality_audit_compliance_rate:
          type: number
          title: Quality Audit Compliance Rate
          description: Percentage of quality audits passed successfully.
        inspection_pass_rate:
          type: number
          title: Inspection Pass Rate
          description: Percentage of items that pass quality inspection upon delivery.
        warranty_claims_rate:
          type: number
          title: Warranty Claims Rate
          description: Percentage of delivered goods that resulted in warranty claims.
        supplier_quality_manager:
          type: string
          title: Supplier Quality Manager
          description: Name of the person responsible for quality assurance at the
            supplier.
        corrective_action_turnaround_time:
          type: integer
          title: Corrective Action Turnaround Time
          description: Average number of days to resolve quality issues raised by
            the buyer.
        customer_complaint_rate:
          type: number
          title: Customer Complaint Rate
          description: Percentage of complaints related to supplier's products or
            services.
        continuous_improvement_programs:
          type: boolean
          title: Continuous Improvement Programs
          description: Indicates if the supplier has active quality improvement initiatives.
        last_quality_audit_date:
          type: string
          format: date-time
          title: Last Quality Audit Date
          description: Date of the most recent quality audit conducted.
        next_quality_audit_date:
          type: string
          format: date-time
          title: Next Quality Audit Date
          description: Scheduled date for the next quality audit.
        inspection_process_details:
          anyOf:
          - type: string
          - type: 'null'
          title: Inspection Process Details
          description: Description of the supplier's internal quality inspection processes.
        first_pass_yield:
          type: number
          title: First Pass Yield
          description: Percentage of goods that meet quality standards without rework.
        material_traceability:
          type: boolean
          title: Material Traceability
          description: Indicates whether the supplier provides traceability for materials
            used.
        adherence_to_specifications:
          type: number
          title: Adherence To Specifications
          description: Percentage of delivered goods meeting exact design or technical
            specifications.
        remarks:
          anyOf:
          - type: string
          - type: 'null'
          title: Remarks
          description: Additional notes or observations about the supplier's quality
            performance.
      type: object
      required:
      - supplier_id
      - item_id
      - location_id
      - quality_rating
      - defect_rate
      - on_time_delivery_rate
      - return_rate
      - non_conformance_reports
      - iso_certifications
      - quality_audit_compliance_rate
      - inspection_pass_rate
      - warranty_claims_rate
      - supplier_quality_manager
      - corrective_action_turnaround_time
      - customer_complaint_rate
      - continuous_improvement_programs
      - last_quality_audit_date
      - next_quality_audit_date
      - first_pass_yield
      - material_traceability
      - adherence_to_specifications
      title: SupplierQualityCreate
