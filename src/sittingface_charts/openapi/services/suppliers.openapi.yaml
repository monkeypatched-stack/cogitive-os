    SupplierShippingCreate:
      properties:
        supplier_id:
          type: string
          title: Supplier Id
          description: Unique identifier for the supplier.
        item_id:
          type: string
          title: Item Id
          description: Unique identifier for the inventory item.
        location_id:
          type: string
          title: Location Id
          description: Unique identifier for the supplier's specific location.
        shipping_method:
          type: string
          title: Shipping Method
          description: The mode of transportation used, for example Air, Sea, Rail,
            Road, or Courier.
        shipping_carrier:
          type: string
          title: Shipping Carrier
          description: Name of the logistics provider or shipping company.
        shipping_terms:
          type: string
          title: Shipping Terms
          description: Delivery terms as per the Incoterms, for example FOB, CIF,
            DDP, or EXW.
        origin_address:
          type: string
          title: Origin Address
          description: Address from which the goods will be shipped.
        destination_address:
          type: string
          title: Destination Address
          description: Delivery address for the goods.
        average_transit_time_days:
          type: integer
          title: Average Transit Time Days
          description: Average number of days required for shipping to the destination.
        shipping_cost:
          type: number
          title: Shipping Cost
          description: Estimated or actual shipping cost per shipment.
        shipping_currency:
          type: string
          title: Shipping Currency
          description: Currency in which the shipping cost is quoted.
        packaging_type:
          type: string
          title: Packaging Type
          description: Type of packaging used for shipments, for example Pallet, Crate,
            or Box.
        max_weight_per_shipment:
          type: number
          title: Max Weight Per Shipment
          description: Maximum allowable weight for a single shipment in kg.
        max_volume_per_shipment:
          type: number
          title: Max Volume Per Shipment
          description: Maximum allowable volume for a single shipment in cubic meters.
        tracking_available:
          type: boolean
          title: Tracking Available
          description: Indicates if shipment tracking is available.
        tracking_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Tracking Url
          description: URL for shipment tracking, if applicable.
        preferred_delivery_time:
          type: string
          title: Preferred Delivery Time
          description: Preferred time window for delivery, for example 9 AM - 5 PM.
        insurance_provided:
          type: boolean
          title: Insurance Provided
          description: Indicates if the shipment is insured.
        insurance_coverage_amount:
          anyOf:
          - type: number
          - type: 'null'
          title: Insurance Coverage Amount
          description: Value covered by shipping insurance.
        freight_class:
          anyOf:
          - type: string
          - type: 'null'
          title: Freight Class
          description: Freight classification for the shipment, for example Hazardous
            or Perishable.
        customs_clearance_included:
          type: boolean
          title: Customs Clearance Included
          description: Indicates if customs clearance is necessary for international
            shipments.
        customs_documentation:
          items:
            type: string
          type: array
          title: Customs Documentation
          description: List of documents required for customs clearance, for example
            Invoice or Packing List.
        last_shipping_date:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Shipping Date
          description: The most recent date a shipment was dispatched by the supplier.
        remarks:
          anyOf:
          - type: string
          - type: 'null'
          title: Remarks
          description: Additional notes or special instructions related to shipping.
      type: object
      required:
      - supplier_id
      - item_id
      - location_id
      - shipping_method
      - shipping_carrier
      - shipping_terms
      - origin_address
      - destination_address
      - average_transit_time_days
      - shipping_cost
      - shipping_currency
      - packaging_type
      - max_weight_per_shipment
      - max_volume_per_shipment
      - tracking_available
      - preferred_delivery_time
      - insurance_provided
      - customs_clearance_included
      - customs_documentation
      title: SupplierShippingCreate
