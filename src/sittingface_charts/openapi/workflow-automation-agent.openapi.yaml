openapi: 3.0.3
info:
  title: workflow-automation-agent API
  description: 'Executes structured multi-step task workflows


    Role: Workflow Automation Agent


    Model: anthropic/claude-sonnet-4-6'
  version: 1.0.0
paths:
  /query:
    post:
      summary: Send a query to workflow-automation-agent
      operationId: workflow-automation-agent_query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                  maxLength: 4096
                session_id:
                  type: string
                context:
                  type: object
      responses:
        '200':
          description: Agent response
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  confidence:
                    type: number
                  tools_used:
                    type: array
                    items:
                      type: string
  /health:
    get:
      summary: workflow-automation-agent health check
      responses:
        '200':
          description: Healthy
  /tools:
    get:
      summary: List available tools for workflow-automation-agent
      responses:
        '200':
          description: Tool list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
