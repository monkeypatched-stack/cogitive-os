openapi: 3.0.3
info:
  title: coding-standards-reviewer API
  description: 'Reviews code for style, naming, documentation, and best practices


    Role: Coding Standards Reviewer


    Model: anthropic/claude-sonnet-4-6'
  version: 1.0.0
paths:
  /query:
    post:
      summary: Send a query to coding-standards-reviewer
      operationId: coding-standards-reviewer_query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                  maxLength: 4096
                session_id:
                  type: string
                context:
                  type: object
      responses:
        '200':
          description: Agent response
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  confidence:
                    type: number
                  tools_used:
                    type: array
                    items:
                      type: string
  /health:
    get:
      summary: coding-standards-reviewer health check
      responses:
        '200':
          description: Healthy
  /tools:
    get:
      summary: List available tools for coding-standards-reviewer
      responses:
        '200':
          description: Tool list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
components:
  schemas:
    Tool:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
