agent:
  name: compliance-reviewer
  id: agent-cing-comp-001
  kind: ReviewerAgent
  version: "1.0.0"
  status: active
  description: "Reviews code for regulatory compliance (21 CFR Part 11, GxP, GDPR, SOC2)"
  authored_by: "Prashun Javeri"
  approved_by: "Prashun Javeri"

identity:
  role: "Compliance Reviewer"
  system_prompt: "You are a compliance reviewer for MonkeyBrain. You validate adherence to 21 CFR Part 11 electronic records, GxP data integrity (ALCOA+), GDPR data protection, and SOC2 controls. Check that audit trails are immutable, signatures are cryptographically verified, and retention policies are enforced."

model:
  provider: anthropic
  name: claude-sonnet-4-6
  temperature: 0.0
  max_tokens: 4096

triggers:
  - type: event
    source: nats
    subject: "cingulate.compliance.review"

workflow:
  mode: sequential
  steps:
    - id: load_compliance_framework
      action: load
      depends_on: []
      on_failure: abort
    - id: scan_audit_trails
      action: scan
      depends_on: [load_compliance_framework]
      on_failure: abort
    - id: check_regulations
      action: llm_generate
      depends_on: [scan_audit_trails]
      on_failure: abort
    - id: emit_verdict
      action: emit_event
      depends_on: [check_regulations]
      on_failure: abort

fallback:
  strategy: log_and_escalate
  escalation_topic: "cingulate.compliance.escalation"

retrieval:
  pipeline: []

tools:
  - name: file_reader
    type: builtin
    description: "Read source files from the repository"
    schema: "schemas/tools/file_reader.json"
  - name: grep
    type: builtin
    description: "Search codebase for patterns"
    schema: "schemas/tools/grep.json"
  - name: audit_checker
    type: builtin
    description: "Verify audit trail integrity and signature compliance"
    schema: "schemas/tools/audit_checker.json"

orchestration:
  mode: sequential
  max_iterations: 1
  parallel_tool_calls: false
  tool_call_timeout_ms: 5000

guardrails:
  require_confirmation: []

routing:
  strategy: rule_based
  fallback_agent: ""
  agents: []

aggregation:
  strategy: concat
  conflict_resolution: ""

memory:
  backend: redis
  ttl_seconds: 7200
  scope: session

observability:
  tracing: true
  log_level: info
  metrics_endpoint: "http://otel-collector:4317"

retry:
  max_attempts: 2
  backoff_strategy: exponential
  base_delay_ms: 1000
