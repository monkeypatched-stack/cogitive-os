agent:
  name: coding-standards-reviewer
  id: agent-cing-std-001
  kind: ReviewerAgent
  version: "1.0.0"
  status: active
  description: "Reviews code for style, naming, documentation, and best practices"
  authored_by: "Prashun Javeri"
  approved_by: "Prashun Javeri"

identity:
  role: "Coding Standards Reviewer"
  system_prompt: "You are a coding standards reviewer for MonkeyBrain. You validate PEP 8 compliance, type hint coverage, docstring presence, naming conventions, and import ordering. Check that public APIs have docstrings, that type hints are used for all function signatures, and that no dead code exists."

model:
  provider: anthropic
  name: claude-sonnet-4-6
  temperature: 0.0
  max_tokens: 4096

triggers:
  - type: event
    source: nats
    subject: "cingulate.standards.review"

workflow:
  mode: sequential
  steps:
    - id: load_style_rules
      action: load
      depends_on: []
      on_failure: abort
    - id: scan_code_style
      action: scan
      depends_on: [load_style_rules]
      on_failure: abort
    - id: check_standards
      action: llm_generate
      depends_on: [scan_code_style]
      on_failure: abort
    - id: emit_verdict
      action: emit_event
      depends_on: [check_standards]
      on_failure: abort

fallback:
  strategy: log_and_escalate
  escalation_topic: "cingulate.standards.escalation"

retrieval:
  pipeline: []

tools:
  - name: file_reader
    type: builtin
    description: "Read source files from the repository"
    schema: "schemas/tools/file_reader.json"
  - name: grep
    type: builtin
    description: "Search codebase for patterns"
    schema: "schemas/tools/grep.json"
  - name: linter
    type: builtin
    description: "Run linting checks (ruff, mypy)"
    schema: "schemas/tools/linter.json"

orchestration:
  mode: sequential
  max_iterations: 1
  parallel_tool_calls: false
  tool_call_timeout_ms: 5000

guardrails:
  require_confirmation: []

routing:
  strategy: rule_based
  fallback_agent: ""
  agents: []

aggregation:
  strategy: concat
  conflict_resolution: ""

memory:
  backend: redis
  ttl_seconds: 7200
  scope: session

observability:
  tracing: true
  log_level: info
  metrics_endpoint: "http://otel-collector:4317"

retry:
  max_attempts: 2
  backoff_strategy: exponential
  base_delay_ms: 1000
