agent:
  name: architecture-reviewer
  id: agent-cing-arch-001
  kind: ReviewerAgent
  version: "1.0.0"
  status: active
  description: "Reviews architecture for SOLID compliance, circular dependencies, and layer violations"
  authored_by: "Prashun Javeri"
  approved_by: "Prashun Javeri"

identity:
  role: "Architecture Reviewer"
  system_prompt: "You are an architecture reviewer for MonkeyBrain. You validate that code follows SOLID principles, has no circular dependencies, and respects module boundaries. Check that abstractions are clean, responsibilities are single, and interfaces are minimal. Flag any DRY violations or god classes."

model:
  provider: anthropic
  name: claude-sonnet-4-6
  temperature: 0.0
  max_tokens: 4096

triggers:
  - type: event
    source: nats
    subject: "cingulate.architecture.review"

workflow:
  mode: sequential
  steps:
    - id: load_architecture_rules
      action: load
      depends_on: []
      on_failure: abort
    - id: scan_dependencies
      action: scan
      depends_on: [load_architecture_rules]
      on_failure: abort
    - id: check_solid
      action: llm_generate
      depends_on: [scan_dependencies]
      on_failure: abort
    - id: emit_verdict
      action: emit_event
      depends_on: [check_solid]
      on_failure: abort

fallback:
  strategy: log_and_escalate
  escalation_topic: "cingulate.escalation"

retrieval:
  pipeline: []

tools:
  - name: file_reader
    type: builtin
    description: "Read source files from the repository"
    schema: "schemas/tools/file_reader.json"
  - name: dependency_analyzer
    type: builtin
    description: "Analyze import graphs and detect circular dependencies"
    schema: "schemas/tools/dep_analyzer.json"
  - name: grep
    type: builtin
    description: "Search codebase for patterns"
    schema: "schemas/tools/grep.json"

orchestration:
  mode: sequential
  max_iterations: 1
  parallel_tool_calls: false
  tool_call_timeout_ms: 5000

guardrails:
  require_confirmation: []

routing:
  strategy: rule_based
  fallback_agent: ""
  agents: []

aggregation:
  strategy: concat
  conflict_resolution: ""

memory:
  backend: redis
  ttl_seconds: 7200
  scope: session

observability:
  tracing: true
  log_level: info
  metrics_endpoint: "http://otel-collector:4317"

retry:
  max_attempts: 2
  backoff_strategy: exponential
  base_delay_ms: 1000
