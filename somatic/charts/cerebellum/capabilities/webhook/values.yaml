capability:
  name: webhook
  id: cap-api-webhook-001
  platform: API/Webhook
  description: Webhook receiver and dispatcher
  version: 1.0.0
  status: active
  authored_by: Prashun Javeri
  approved_by: Prashun Javeri
  effective_date: '2026-06-27'
  review_date: '2026-12-27'
  module_id: cerebellum
  module_name: Cerebellum
  plant_id: ''
  line_id: ''
  stage_id: ''
  tags:
  - api
  - webhook
  - event
  references:
  - src/cerebellum/capabilities/webhook.py
  document_ids: []
  notes: ''
  remarks: ''
auth:
  type: none
  header_name: ''
  format_template: ''
  scopes: []
  refresh_endpoint: ''
  ttl_seconds: null
endpoint:
  base_url: http://localhost:8000/webhook
  protocol: http
  version: 1.0.0
  tls_verify: false
  timeout_seconds: 30
operations:
- name: register
  method: CREATE
  path: /register
  description: Register a webhook endpoint
  required_params:
  - url
  - events
  optional_params: []
  paginated: false
  pagination_cursor_field: ''
- name: dispatch
  method: CREATE
  path: /dispatch
  description: Dispatch a webhook event
  required_params:
  - event
  - payload
  optional_params: []
  paginated: false
  pagination_cursor_field: ''
rate_limit:
  requests_per_hour: 1000
  requests_per_minute: null
  burst_capacity: null
  strategy: fixed_window
  backoff_multiplier: 2.0
  max_retries: 3
  retry_on_status:
  - 500
  - 502
  - 503
error_handling:
  transient_statuses:
  - 500
  - 502
  - 503
  - 504
  permanent_statuses:
  - 400
  - 401
  - 403
  - 404
  retry_delay_ms: 1000
  circuit_breaker_threshold: 5
  circuit_breaker_window_seconds: 60
tests:
  mock_responses: {}
  integration_tests:
  - test_webhook_connect
  - test_webhook_execute
  test_scenarios:
  - happy_path
  - timeout
  - error
