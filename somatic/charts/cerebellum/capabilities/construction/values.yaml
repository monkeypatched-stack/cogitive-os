capability:
  name: construction
  id: cap-construct-001
  platform: Construction
  description: Construction integrations (Project Management, Equipment Scheduling, Site Safety)
  version: 1.0.0
  status: active
  authored_by: MonkeyBrain
  approved_by: MonkeyBrain
  effective_date: '2026-07-10'
  review_date: '2027-01-10'
  module_id: cerebellum
  module_name: Cerebellum
  plant_id: ''
  line_id: ''
  stage_id: ''
  tags:
  - construction
  - projects
  - equipment
  - safety
  references:
  - src/cerebellum/capabilities/construction.py
  document_ids: []
  notes: ''
  remarks: ''
auth:
  type: none
  header_name: ''
  format_template: ''
  scopes: []
  refresh_endpoint: ''
  ttl_seconds: null
endpoint:
  base_url: http://localhost:8000/construction
  protocol: http
  version: 1.0.0
  tls_verify: false
  timeout_seconds: 30
operations:
- name: manage_project
  method: UPDATE
  path: /projects/{project_id}
  description: Manage construction project
  required_params:
  - project_id
  - action
  optional_params:
  - phase
  - budget
  paginated: false
  pagination_cursor_field: ''
- name: schedule_equipment
  method: CREATE
  path: /equipment/schedule
  description: Schedule equipment
  required_params:
  - equipment_id
  - site_id
  - start_date
  - end_date
  optional_params:
  - operator
  paginated: false
  pagination_cursor_field: ''
- name: perform_inspection
  method: CREATE
  path: /inspections
  description: Perform site safety inspection
  required_params:
  - site_id
  - inspector_id
  - checklist
  optional_params:
  - photos
  - notes
  paginated: false
  pagination_cursor_field: ''
- name: list_projects
  method: READ
  path: /projects
  description: List construction projects
  required_params: []
  optional_params:
  - status
  - region
  paginated: true
  pagination_cursor_field: cursor
- name: get_site_status
  method: READ
  path: /sites/{site_id}
  description: Get site status
  required_params:
  - site_id
  optional_params: []
  paginated: false
  pagination_cursor_field: ''
rate_limit:
  requests_per_hour: 1000
  requests_per_minute: null
  burst_capacity: null
  strategy: fixed_window
  backoff_multiplier: 2.0
  max_retries: 3
  retry_on_status:
  - 500
  - 502
  - 503
error_handling:
  transient_statuses:
  - 500
  - 502
  - 503
  - 504
  permanent_statuses:
  - 400
  - 401
  - 403
  - 404
  retry_delay_ms: 1000
  circuit_breaker_threshold: 5
  circuit_breaker_window_seconds: 60
tests:
  mock_responses: {}
  integration_tests:
  - test_construction_connect
  - test_construction_execute
  test_scenarios:
  - happy_path
  - timeout
  - error
