  document_ids: []
  notes: ''
  remarks: ''
auth:
  type: none
  header_name: ''
  format_template: ''
  scopes: []
  refresh_endpoint: ''
  ttl_seconds: null
endpoint:
  base_url: http://localhost:8000/influxdb
  protocol: http
  version: 1.0.0
  tls_verify: false
  timeout_seconds: 30
operations:
- name: write_lp
  method: CREATE
  path: /write_lp
  description: Write line protocol data
  required_params:
  - lines
  optional_params: []
  paginated: false
  pagination_cursor_field: ''
- name: query_sql
  method: READ
  path: /query_sql
  description: Query with SQL
  required_params:
  - sql
  optional_params: []
  paginated: false
  pagination_cursor_field: ''
- name: query_influxql
  method: READ
  path: /query
  description: Query with InfluxQL
  required_params:
  - query
  optional_params: []
  paginated: false
  pagination_cursor_field: ''
rate_limit:
  requests_per_hour: 1000
  requests_per_minute: null
  burst_capacity: null
  strategy: fixed_window
  backoff_multiplier: 2.0
  max_retries: 3
  retry_on_status:
  - 500
  - 502
  - 503
error_handling:
  transient_statuses:
  - 500
  - 502
  - 503
  - 504
  permanent_statuses:
  - 400
  - 401
  - 403
  - 404
  retry_delay_ms: 1000
  circuit_breaker_threshold: 5
  circuit_breaker_window_seconds: 60
tests:
  mock_responses: {}
  integration_tests:
  - test_influxdb_connect
  - test_influxdb_execute
  test_scenarios:
  - happy_path
  - timeout
  - error
