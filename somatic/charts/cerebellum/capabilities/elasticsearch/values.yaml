capability:
  name: elasticsearch
  id: cap-db-elasticsearch-001
  platform: Database/Search
  description: Elasticsearch for full-text search and audit indexing
  version: 1.0.0
  status: active
  authored_by: Prashun Javeri
  approved_by: Prashun Javeri
  effective_date: '2026-06-27'
  review_date: '2026-12-27'
  module_id: cerebellum
  module_name: Cerebellum
  plant_id: ''
  line_id: ''
  stage_id: ''
  tags:
  - database
  - elasticsearch
  - search
  - audit
  references:
  - src/cerebellum/capabilities/elasticsearch.py
  document_ids: []
  notes: ''
  remarks: ''
auth:
  type: none
  header_name: ''
  format_template: ''
  scopes: []
  refresh_endpoint: ''
  ttl_seconds: null
endpoint:
  base_url: http://localhost:8000/elasticsearch
  protocol: http
  version: 1.0.0
  tls_verify: false
  timeout_seconds: 30
operations:
- name: index
  method: CREATE
  path: /{index}/doc
  description: Index a document
  required_params:
  - index
  - document
  optional_params:
  - id
  paginated: false
  pagination_cursor_field: ''
- name: search
  method: READ
  path: /{index}/_search
  description: Search documents
  required_params:
  - index
  - query
  optional_params:
  - size
  paginated: false
  pagination_cursor_field: ''
- name: delete
  method: DELETE
  path: /{index}/doc/{id}
  description: Delete a document
  required_params:
  - index
  - id
  optional_params: []
  paginated: false
  pagination_cursor_field: ''
rate_limit:
  requests_per_hour: 1000
  requests_per_minute: null
  burst_capacity: null
  strategy: fixed_window
  backoff_multiplier: 2.0
  max_retries: 3
  retry_on_status:
  - 500
  - 502
  - 503
error_handling:
  transient_statuses:
  - 500
  - 502
  - 503
  - 504
  permanent_statuses:
  - 400
  - 401
  - 403
  - 404
  retry_delay_ms: 1000
  circuit_breaker_threshold: 5
  circuit_breaker_window_seconds: 60
tests:
  mock_responses: {}
  integration_tests:
  - test_elasticsearch_connect
  - test_elasticsearch_execute
  test_scenarios:
  - happy_path
  - timeout
  - error
