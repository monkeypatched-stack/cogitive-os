capability:
  name: automotive
  id: cap-auto-001
  platform: Automotive
  description: Automotive integrations (Vehicle Manufacturing, Dealer Management, Connected Vehicles)
  version: 1.0.0
  status: active
  authored_by: MonkeyBrain
  approved_by: MonkeyBrain
  effective_date: '2026-07-10'
  review_date: '2027-01-10'
  module_id: cerebellum
  module_name: Cerebellum
  plant_id: ''
  line_id: ''
  stage_id: ''
  tags:
  - automotive
  - vehicles
  - dealers
  - telematics
  references:
  - src/cerebellum/capabilities/automotive.py
  document_ids: []
  notes: ''
  remarks: ''
auth:
  type: none
  header_name: ''
  format_template: ''
  scopes: []
  refresh_endpoint: ''
  ttl_seconds: null
endpoint:
  base_url: http://localhost:8000/automotive
  protocol: http
  version: 1.0.0
  tls_verify: false
  timeout_seconds: 30
operations:
- name: track_vehicle
  method: READ
  path: /vehicles/{vehicle_id}/telemetry
  description: Track vehicle telemetry
  required_params:
  - vehicle_id
  optional_params:
  - metrics
  - time_range
  paginated: false
  pagination_cursor_field: ''
- name: manage_dealer
  method: UPDATE
  path: /dealers/{dealer_id}
  description: Manage dealer operations
  required_params:
  - dealer_id
  - action
  optional_params:
  - inventory
  paginated: false
  pagination_cursor_field: ''
- name: schedule_service
  method: CREATE
  path: /service
  description: Schedule vehicle service
  required_params:
  - vehicle_id
  - service_type
  - preferred_date
  optional_params:
  - dealer_id
  paginated: false
  pagination_cursor_field: ''
- name: handle_recall
  method: CREATE
  path: /recalls
  description: Handle vehicle recall
  required_params:
  - vehicle_ids
  - component
  - reason
  optional_params:
  - remedy
  paginated: false
  pagination_cursor_field: ''
- name: list_vehicles
  method: READ
  path: /vehicles
  description: List vehicles
  required_params: []
  optional_params:
  - status
  - model
  - dealer_id
  paginated: true
  pagination_cursor_field: cursor
rate_limit:
  requests_per_hour: 1000
  requests_per_minute: null
  burst_capacity: null
  strategy: fixed_window
  backoff_multiplier: 2.0
  max_retries: 3
  retry_on_status:
  - 500
  - 502
  - 503
error_handling:
  transient_statuses:
  - 500
  - 502
  - 503
  - 504
  permanent_statuses:
  - 400
  - 401
  - 403
  - 404
  retry_delay_ms: 1000
  circuit_breaker_threshold: 5
  circuit_breaker_window_seconds: 60
tests:
  mock_responses: {}
  integration_tests:
  - test_automotive_connect
  - test_automotive_execute
  test_scenarios:
  - happy_path
  - timeout
  - error
