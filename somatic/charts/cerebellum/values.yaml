principles:
- id: 1
  name: EverythingIsACapability
  statement: Every external integration is a Capability. Runtime never knows implementation
    details.
- id: 2
  name: CapabilitiesAreDrivers
  statement: Capabilities are runtime drivers. Same contract as OS device drivers.
- id: 3
  name: UniformLifecycle
  statement: "Every capability implements the common lifecycle: Initialize \u2192\
    \ Configure \u2192 Validate \u2192 Register \u2192 Discover \u2192 Execute \u2192\
    \ Observe \u2192 Shutdown."
- id: 4
  name: ExecutionByRuntime
  statement: Capabilities never decide when they execute. Execution belongs to the runtime.
- id: 5
  name: StatelessExecution
  statement: Capabilities remain stateless. State belongs to reducers and persistence
    manager.
- id: 6
  name: DependencyInjection
  statement: Capabilities never instantiate dependencies. All injected by runtime.
invariants:
- id: CER-INV-001
  rule: no_scheduling_in_cerebellum
  statement: cerebellum never schedules. Scheduling belongs to the runtime.
  severity: critical
  rejection: "REJECTED \u2014 Scheduling logic found in cerebellum."
- id: CER-INV-002
  rule: no_planning_in_cerebellum
  statement: cerebellum never plans. Planning belongs to the kernel.
  severity: critical
  rejection: "REJECTED \u2014 Planning logic found in cerebellum."
- id: CER-INV-003
  rule: uniform_lifecycle
  statement: Every capability must implement the 8-stage lifecycle contract.
  severity: high
  rejection: "REJECTED \u2014 Capability missing lifecycle contract."
- id: CER-INV-004
  rule: stateless_capabilities
  statement: Capabilities must not own runtime state.
  severity: high
  rejection: "REJECTED \u2014 Capability owns runtime state."
deliverables:
- artifact: CapabilityBaseInterfaces
