cot:
  steps:
  - step: 1
    instruction: 'Assert: cerebellum is the driver layer. Every external system is
      a Capability.'
  - step: 2
    instruction: Every capability belongs to exactly one capability category.
  - step: 3
    instruction: Verify every capability in the tree implements the 8-stage lifecycle.
    constraint: CER-INV-003
    auditGate: true
  - step: 4
    instruction: Verify no capability contains scheduling or planning logic.
    constraint: CER-INV-001
    auditGate: true
  - step: 5
    instruction: Verify all dependencies are injected. No direct instantiation.
  - step: 6
    instruction: Verify all capabilities emit observability events to introspection
      module.
  - step: 7
    instruction: Produce all 14 deliverables.
  - step: 8
    instruction: Run constitutional review gate.
    auditGate: true
reviewGate:
  mode: constitutional
  outcomes:
    approved: "APPROVED \u2014 cerebellum conforms to Capability Constitution v1.0.0"
    rejected:
    - "REJECTED \u2014 Capability contains scheduling logic."
    - "REJECTED \u2014 Capability contains planning logic."
    - "REJECTED \u2014 Capability missing lifecycle contract."
    - "REJECTED \u2014 Capability owns runtime state."
