module:
  name: write-blog-post-about-api
  description: Write Blog Post About management service
preamble:
  statement: You are a senior software architect generating a production-grade FastAPI
    service for Write Blog Post About management service. The service is structured
    around Domain-Driven Design with a WriteBlogPostAbout aggregate root, entities
    [WriteBlogPostAboutItem], and value objects [Status, Reference]. Authentication
    uses JWT Bearer tokens validated in a FastAPI dependency. All requests are structured-logged
    through the Lemon logger with correlation-ID propagation. Errors are captured
    in Sentry via a global middleware. All inbound/outbound spans are emitted via
    OpenTelemetry middleware to the Lemon collector.
invariants:
- id: WRITE--INV-001
  rule: reference_unique
  statement: Every Write Blog Post About must have a unique, immutable reference identifier.
  severity: critical
  rejection: REJECTED — Duplicate Write Blog Post About reference.
- id: WRITE--INV-002
  rule: deleted_not_mutable
  statement: A deleted Write Blog Post About must not accept further mutations.
  severity: critical
  rejection: REJECTED — Mutated deleted Write Blog Post About.
- id: WRITE--AUTH-001
  rule: auth_on_every_protected_route
  statement: Every non-public route must declare the get_current_user dependency.
  severity: critical
  rejection: REJECTED — Protected route missing auth dependency.
- id: WRITE--LOG-001
  rule: lemon_structured_logging
  statement: Every request handler must emit at least one structured Lemon log entry
    with component, correlation_id, and user_id.
  severity: high
  rejection: REJECTED — Handler missing Lemon structured log.
- id: WRITE--OBS-001
  rule: sentry_middleware_only
  statement: Sentry capture must only happen in the global exception middleware, never
    inside business logic.
  severity: high
  rejection: REJECTED — Manual sentry_sdk.capture_exception in business logic.
- id: WRITE--OBS-002
  rule: otel_middleware_first
  statement: OpenTelemetryMiddleware must be registered before any route-level middleware.
  severity: high
  rejection: REJECTED — OpenTelemetry middleware out of order.
- id: WRITE--DDD-001
  rule: domain_no_framework_imports
  statement: domain/ files must never import from fastapi, motor, httpx, or any infrastructure
    package.
  severity: critical
  rejection: REJECTED — Domain layer contains framework import.
- id: WRITE--DDD-002
  rule: domain_events_on_mutation
  statement: Every WriteBlogPostAbout mutation must raise and publish at least one
    domain event.
  severity: high
  rejection: REJECTED — WriteBlogPostAbout mutation produces no domain event.
cot:
  steps:
  - step: 1
    title: Domain layer — entities, value objects, aggregates, events, repository
      ABC
    description: 'Pure Python only. WriteBlogPostAbout aggregate root enforces invariants,
      emits WriteBlogPostAboutCreated, WriteBlogPostAboutUpdated, WriteBlogPostAboutDeleted.
      Subdirs: entities/, value_objects/, aggregates/, repositories/, events/, services/,
      specifications/, exceptions/, policies/'
  - step: 2
    title: Application layer — commands, queries, handlers, dto
    description: 'Handlers orchestrate: load aggregate → invoke behavior → persist
      → emit events. No framework imports. Subdirs: commands/, queries/, handlers/,
      dto/'
  - step: 3
    title: Infrastructure layer — Motor repository, database connection
    description: MotorWriteBlogPostAboutRepository in infrastructure/persistence/motor/.
      AsyncIOMotorClient factory in infrastructure/database/. No SQLAlchemy.
  - step: 4
    title: API layer — FastAPI router, Pydantic schemas, JWT dependencies
    description: router.py calls handlers ONLY. All protected routes use Depends(get_current_user)
      from dependencies.py.
  - step: 5
    title: Main + settings — lifespan, Sentry, /health, structured logging
    description: 'Lifespan: Sentry → Motor → yield → close. /health endpoint. Timing
      middleware.'
reviewGate:
  mode: constitutional
  outcomes:
    approved: APPROVED — write-blog-post-about API conforms to all DDD, auth, and
      observability invariants.
    rejected:
    - REJECTED — Duplicate Write Blog Post About reference.
    - REJECTED — Mutated deleted Write Blog Post About.
    - REJECTED — Protected route missing auth dependency.
    - REJECTED — Handler missing Lemon structured log.
    - REJECTED — Manual sentry_sdk.capture_exception in business logic.
    - REJECTED — OpenTelemetry middleware out of order.
    - REJECTED — Domain layer contains framework import.
    - REJECTED — WriteBlogPostAbout mutation produces no domain event.
