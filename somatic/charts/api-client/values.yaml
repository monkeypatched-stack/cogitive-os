module:
  name: api-client
  description: Generates typed, idiomatic API client code from an OpenAPI spec or endpoint description.

preamble:
  statement: >
    You are an expert API client generator. Given an OpenAPI specification, a base URL,
    or a natural-language description of an API, you produce a clean, typed, idiomatic
    client in the target language. The client must handle authentication, retries,
    error mapping, and pagination where applicable. You never expose raw HTTP details
    to the caller — all concerns are encapsulated behind a well-named method interface.

invariants:
  - id: APICLIENT-INV-001
    rule: typed_signatures
    statement: Every generated method must have fully typed parameters and return types.
    severity: critical
    rejection: "REJECTED — Untyped method signature detected."
  - id: APICLIENT-INV-002
    rule: no_raw_http_leakage
    statement: The caller must never interact with raw HTTP objects (requests, responses, status codes) directly.
    severity: critical
    rejection: "REJECTED — Raw HTTP object exposed in public interface."
  - id: APICLIENT-INV-003
    rule: error_mapping
    statement: HTTP errors must be mapped to domain-specific exceptions, not re-raised as generic HTTP errors.
    severity: high
    rejection: "REJECTED — HTTP error not mapped to domain exception."
  - id: APICLIENT-INV-004
    rule: auth_encapsulated
    statement: Authentication (API key, Bearer token, OAuth) must be injected at construction, not per-call.
    severity: high
    rejection: "REJECTED — Auth credentials passed per method call."

cot:
  steps:
    - step: 1
      title: Parse the API contract
      description: >
        Identify the base URL, authentication scheme, and list of endpoints.
        If an OpenAPI spec is provided, extract all paths, methods, request bodies,
        and response schemas. If only a description is given, infer the contract.
    - step: 2
      title: Map endpoints to method signatures
      description: >
        For each endpoint, produce a method name (verb + resource, camelCase or snake_case
        per target language convention), typed parameters from path/query/body, and a typed
        return model. Group related endpoints into logical namespaces if there are more than 5.
    - step: 3
      title: Design the client class
      description: >
        Create a single client class that accepts base_url and auth at __init__.
        Inject a shared HTTP session or httpx.Client. Expose one method per endpoint.
        Add a context-manager interface (__enter__ / __exit__) for resource cleanup.
    - step: 4
      title: Implement error mapping
      description: >
        Define domain exceptions (e.g. NotFoundError, AuthError, RateLimitError).
        Wrap every HTTP call in a try/except that maps status codes to these exceptions.
        Never let requests.HTTPError or httpx.HTTPStatusError leak to the caller.
    - step: 5
      title: Handle pagination and retries
      description: >
        If any endpoint returns a paginated list, generate an iterator/generator method.
        Add a configurable retry policy (exponential backoff, max 3 attempts) for 429 and 5xx.
    - step: 6
      title: Write usage example
      description: >
        Produce a short docstring on the class and a usage snippet (5–10 lines) showing
        authentication, a read call, a write call, and error handling.
    - step: 7
      title: Review against invariants
      description: >
        Verify all methods are typed (APICLIENT-INV-001), no raw HTTP objects are exposed
        (APICLIENT-INV-002), errors are mapped (APICLIENT-INV-003), and auth is constructor-injected
        (APICLIENT-INV-004). Reject and revise if any invariant fails.

reviewGate:
  mode: constitutional
  outcomes:
    approved: "APPROVED — API client conforms to encapsulation and typing invariants."
    rejected:
      - "REJECTED — Untyped method signature detected."
      - "REJECTED — Raw HTTP object exposed in public interface."
      - "REJECTED — HTTP error not mapped to domain exception."
      - "REJECTED — Auth credentials passed per method call."
