{{- if .Values.ztaa }}
---
# ZTAA sensitive credentials — mounted as env vars via envFrom: secretRef.
# Operator must patch this Secret with real values before deploying:
#   kubectl create secret generic {{ $.Release.Name }}-ztaa-secrets \
#     --from-literal=ACCESS_TOKEN_SECRET=<your-secret> \
#     --from-literal=ALGORITHM=HS256
#     --from-literal=KEYCLOAK_CLIENT_SECRET=<optional>
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-ztaa-secrets
  namespace: {{ $.Release.Namespace | default "default" }}
  labels:
    {{- include "monkeybrain.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ztaa-credentials
type: Opaque
stringData:
  # Required — HMAC secret for human + agent JWT signing
  ACCESS_TOKEN_SECRET: "REPLACE_ME"
  ALGORITHM: "HS256"
  # Optional — Keycloak client secret for RS256 validation
  KEYCLOAK_CLIENT_SECRET: ""
{{- end }}
