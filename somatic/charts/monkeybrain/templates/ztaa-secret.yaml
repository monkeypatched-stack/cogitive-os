{{- if .Values.ztaa }}
{{- $secret := .Values.ztaa.accessTokenSecret | default "" }}
{{- if or (eq $secret "") (eq $secret "REPLACE_ME") }}
{{- fail "ztaa.accessTokenSecret must be set to a unique HMAC secret (do not use REPLACE_ME or leave empty)." }}
{{- end }}
---
# ZTAA credentials — values MUST be supplied at install time. This chart
# never ships a usable default HMAC secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-ztaa-secrets
  namespace: {{ $.Release.Namespace | default "default" }}
  labels:
    {{- include "monkeybrain.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ztaa-credentials
type: Opaque
stringData:
  ACCESS_TOKEN_SECRET: {{ $secret | quote }}
  ALGORITHM: "HS256"
  {{- if .Values.ztaa.keycloakClientSecret }}
  KEYCLOAK_CLIENT_SECRET: {{ .Values.ztaa.keycloakClientSecret | quote }}
  {{- end }}
{{- end }}
