[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monkeybrain-deepdive"
version = "1.0.0"
description = "MonkeyBrain DeepDive — Analytics and aggregation layer"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
authors = [{ name = "Prashun Javeri" }]
keywords = ["analytics", "aggregation", "fleet", "knowledge", "elasticsearch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = []

[project.optional-dependencies]
elasticsearch = ["elasticsearch[async]"]

[tool.setuptools]
packages = ["deepdive"]

[tool.setuptools.package-dir]
deepdive = "."
