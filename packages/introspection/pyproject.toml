[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monkeybrain-introspection"
version = "1.0.0"
description = "MonkeyBrain Introspection — Lemon observability layer for the Cognitive Operating System"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
authors = [{ name = "Prashun Javeri" }]
keywords = ["observability", "tracing", "metrics", "logging", "health", "alerting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[tool.setuptools.packages.find]
include = ["introspection*"]

[tool.ruff]
line-length = 120
target-version = "py311"
