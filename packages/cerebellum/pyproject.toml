[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monkeybrain-cerebellum"
version = "1.0.0"
description = "MonkeyBrain Cerebellum — Capability framework for the Cognitive Operating System"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
authors = [{ name = "Prashun Javeri" }]
keywords = ["ai", "capabilities", "cognitive-os", "agent", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic",
    "httpx",
]

[project.optional-dependencies]
ai = ["openai", "anthropic"]
databases = ["motor", "pymongo", "redis[asyncio]", "neo4j", "influxdb-client"]
enterprise = ["elasticsearch[async]"]
all = ["monkeybrain-cerebellum[ai,databases,enterprise]"]

[project.scripts]

[tool.setuptools.packages.find]
include = ["cerebellum*"]

[tool.setuptools.package-data]
"*" = ["*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
