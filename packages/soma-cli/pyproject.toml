[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soma-cli"
version = "1.0.0"
description = "Soma — Constitutional Compiler & CLI for MonkeyBrain"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Prashun Javeri", email = "prashun@monkeypatched.com" }]
keywords = ["agentos", "monkeybrain", "constitution-driven-development", "soma"]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "watchfiles>=0.21.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
soma = "soma.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["soma*"]

[tool.ruff]
line-length = 100
target-version = "py311"
