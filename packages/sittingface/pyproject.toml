[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sittingface"
version = "1.0.0"
description = "SittingFace — HuggingFace-style registry for MonkeyBrain somatic charts and Helm charts"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
authors = [{ name = "Prashun Javeri" }]
keywords = ["monkeybrain", "registry", "charts", "somatic", "constitution", "helm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.scripts]
sittingface = "sittingface.cli.main:app"

[tool.setuptools.packages.find]
include = ["sittingface*"]

[tool.ruff]
line-length = 120
target-version = "py311"
