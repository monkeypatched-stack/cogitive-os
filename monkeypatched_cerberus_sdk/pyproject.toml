[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monkeypatched-cerebellum-sdk"
version = "1.0.0"
description = "MonkeyBrain Cerebellum SDK - Capability Framework"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [{name = "MonkeyBrain Team", email = "team@monkeybrain.dev"}]
keywords = ["cognitive-operating-system", "capabilities", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
full = [
    "monkeybrain>=1.0.0",
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://monkeybrain.dev"

[tool.hatch.build.targets.wheel]
packages = ["monkeypatched_cerberus_sdk"]
