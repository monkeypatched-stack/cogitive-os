# SPIRE Server — Kubernetes deployment. Same namespace (monkeybrain) and
# labeling conventions as every other manifest in this directory.
#
# Uses SPIRE's own SQL datastore + self-signed intermediate CA (no custom
# CA/issuance logic anywhere in this repo -- Non-negotiable rules 1/2). For
# a real production trust anchor, configure upstream_ca in the ConfigMap
# below to chain to your organization's existing root instead of SPIRE's
# self-signed default -- an operator decision this manifest does not make.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  namespace: monkeybrain
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-server-trust-role
rules:
  # k8s_psat node attestation needs to validate the projected service
  # account token an spire-agent presents -- the TokenReview API is the
  # standard, supported mechanism (not a custom attestation protocol).
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-server-trust-role-binding
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: monkeybrain
roleRef:
  kind: ClusterRole
  name: spire-server-trust-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server-config
  namespace: monkeybrain
data:
  server.conf: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "8081"
      # Configurable, deployment-specific -- see kernel/workload_identity.py::
      # configured_trust_domain(), which reads the SAME SPIFFE_TRUST_DOMAIN
      # value via agentos-config so kernel-side code and this Server agree
      # on the trust domain without it being hard-coded twice. MUST differ
      # from the local-dev trust domain (docker-compose.spire.yml) -- a
      # dev-issued SVID must never even parse as belonging to this one.
      trust_domain = "cognitiveos.production"
      data_dir = "/run/spire/data"
      log_level = "INFO"
    }
    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "sqlite3"
          connection_string = "/run/spire/data/datastore.sqlite3"
        }
      }
      # k8s_psat: the standard SPIRE node attestor for Kubernetes --
      # verifies a Projected Service Account Token via TokenReview,
      # binding each Node's identity to a real cluster credential instead
      # of a manually-provisioned join token (Phase 4: Kubernetes workload
      # identity/attestation, not manual certificate provisioning).
      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = {
            "cognitiveos" = {
              service_account_allow_list = ["monkeybrain:spire-agent"]
            }
          }
        }
      }
      KeyManager "disk" {
        plugin_data {
          keys_path = "/run/spire/data/keys.json"
        }
      }
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: monkeybrain
  labels:
    app: spire-server
    component: workload-identity
spec:
  serviceName: spire-server
  replicas: 1
  selector:
    matchLabels:
      app: spire-server
  template:
    metadata:
      labels:
        app: spire-server
    spec:
      serviceAccountName: spire-server
      containers:
        - name: spire-server
          image: ghcr.io/spiffe/spire-server:1.9.6
          imagePullPolicy: IfNotPresent
          args: ["-config", "/run/spire/config/server.conf"]
          ports:
            - containerPort: 8081
              name: grpc
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
              readOnly: true
            - name: spire-data
              mountPath: /run/spire/data
          readinessProbe:
            exec:
              command: ["/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/tmp/spire-server/private/api.sock"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: spire-config
          configMap:
            name: spire-server-config
  volumeClaimTemplates:
    - metadata:
        name: spire-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: spire-server
  namespace: monkeybrain
  labels:
    app: spire-server
spec:
  selector:
    app: spire-server
  ports:
    - port: 8081
      targetPort: 8081
      name: grpc
  clusterIP: None
