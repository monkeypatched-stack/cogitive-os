  name: agentos
  namespace: monkeybrain
  labels:
    app: agentos
    component: cognitive-runtime
    role: api-backend
spec:
  selector:
    app: agentos
  ports:
    - port: 8031
      targetPort: 8031
      protocol: TCP
      name: http
  type: ClusterIP
