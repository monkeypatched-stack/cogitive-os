apiVersion: v1
kind: ConfigMap
metadata:
  name: agentos-config
  namespace: monkeybrain
data:
  MONGODB_URL: "mongodb://mongodb:27017"
  DB_NAME: "demo"
  REDIS_URL: "redis://redis:6379"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  # NEO4J_PASSWORD intentionally NOT here — a ConfigMap is plaintext-
  # visible to anyone who can `kubectl get configmap -o yaml`. It's
  # supplied to the container as a real env var via secret.yaml's
  # agentos-secrets Secret (see deployment.yaml's env: block).
  MB_WORLD_TENSOR: "true"
  MB_WORLD_TENSOR_PATH: "/data/world_tensor.json"
  AGENTOS_AUTH_REQUIRED: "true"
  # Was unset here — require_opa() (api/dependencies.py) fails OPEN
  # (default_allow=True) whenever OPA_URL is unset or unreachable, so
  # every require_opa(...) check on every route silently allowed
  # everything in this deployment until opa.yaml's real OPA service
  # existed for this to point at.
  OPA_URL: "http://opa:8181"
  LOG_LEVEL: "INFO"
