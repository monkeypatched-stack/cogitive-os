apiVersion: v1
kind: Secret
metadata:
  name: agentos-secrets
  namespace: monkeybrain
  labels:
    app: agentos
    component: cognitive-runtime
type: Opaque
stringData:
  # Placeholder only — this file is committed to git, so it MUST be
  # overridden before a real deploy (kustomize secretGenerator,
  # `kubectl create secret --dry-run=client -o yaml | kubectl apply -f -`,
  # or an external-secrets/Vault/Sealed-Secrets controller). Moved out of
  # agentos-config (a plain ConfigMap, base64-equivalent-visible to
  # anyone with `kubectl get configmap -o yaml`) so the credential at
  # least has the right K8s object type and RBAC boundary; this alone
  # does not make the checked-in value itself safe to run in production.
  #
  # Randomly generated (python3 -c "import secrets; print(secrets.
  # token_urlsafe(24))"), not the literal word "password" — this repo has
  # no k8s-deployed Neo4j of its own to keep in sync with (only
  # docker-compose.yml's separate, self-contained local-dev Neo4j uses
  # "password", and that's an intentionally simple dev default, not this
  # file), so there's nothing this value needs to match; it exists only
  # to not be a well-known/guessable string for whoever forgets to
  # override it, not to imply this checked-in value is itself safe to run.
  neo4j-password: "j002MaGGyF8z_cBzgSZhX3FRy_8SRCsI"
  # neo4j.yaml's NEO4J_AUTH env var — Neo4j's own required
  # "user/password" format, derived from the same password above so
  # there's exactly one credential to rotate, not two.
  neo4j-auth: "neo4j/j002MaGGyF8z_cBzgSZhX3FRy_8SRCsI"
  # Shared token for control-plane -> actor-runtime /execute proxying.
  # Override before production deploy (same guidance as neo4j-password above).
  internal-service-token: "change-me-internal-service-token"
