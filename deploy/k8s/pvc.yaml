apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentos-data
  namespace: monkeybrain
  labels:
    app: agentos
    component: cognitive-runtime
spec:
  # ReadWriteOnce, kept unchanged even though MB_WORLD_TENSOR_PATH (kernel/
  # compile/world_tensor.py) is now only a FALLBACK — the default is a
  # shared Redis-backed store (kernel/compile/redis_world_store.py) that
  # needs no volume at all. This PVC still backs the fallback path (Redis
  # unreachable, or AGENTOS_WORLD_BACKEND=memory forced) and belief/world
  # checkpoints (kernel/pipeline/execution_checkpoint_store.py etc. are
  # Redis-backed, but a few legacy local-file fallbacks remain), so it is
  # still one pod's exclusive local file, same cross-writer-coordination
  # caveat as before if it were ever mounted RWX. See deployment.yaml's
  # `replicas` comment for the other reasons this deployment still isn't
  # safe to scale beyond 1.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
