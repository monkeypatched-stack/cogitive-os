# SPIRE Server — local development configuration.
#
# Uses SPIRE's own built-in CA (upstream_ca unset -> SPIRE self-signs its
# own intermediate) -- this is SPIRE's standard, supported mechanism, not
# a custom CA this repo implements (Non-negotiable rule 1). For a real
# production deployment, configure upstream_ca to chain to your
# organization's real root (e.g. AWS PCA, Vault, or another existing CA)
# instead of using SPIRE's self-signed default -- that is an operator
# configuration choice this file deliberately does not make for you.
server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "cognitiveos-dev.local"
    data_dir = "/run/spire/data"
    log_level = "INFO"
    # Never overridden equal to a production trust domain -- see
    # docker-compose.spire.yml's header comment.
    ca_subject {
        country = ["US"]
        organization = ["CognitiveOS-Dev"]
        common_name = ""
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/run/spire/data/datastore.sqlite3"
        }
    }

    # join_token: the simplest node attestation for a single-host Compose
    # dev environment -- the spire-agent container presents a one-time
    # token (deploy/spire/register-entries.sh generates it) instead of a
    # cloud/k8s-specific attestor. Kubernetes uses k8s_psat instead (see
    # deploy/k8s/spire-server.yaml) -- this plugin is dev-only.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/run/spire/data/keys.json"
        }
    }
}
