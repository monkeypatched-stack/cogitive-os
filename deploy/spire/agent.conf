# SPIRE Agent — local development configuration.
#
# workload_x509_svid_key_type/ttl left at SPIRE's own defaults --
# short-lived SVIDs with automatic rotation are SPIRE's built-in
# behavior, not something this repo re-implements (Phase 19: "verify what
# SPIRE provides automatically and use it rather than implementing
# duplicate rotation logic").
agent {
    data_dir = "/run/spire"
    log_level = "INFO"
    server_address = "spire-server"
    server_port = "8081"
    trust_domain = "cognitiveos-dev.local"
    socket_path = "/tmp/spire-agent/public/api.sock"
    # Populated by register-entries.sh's join-token step at startup; a
    # real k8s deployment uses k8s_psat instead and never sets this.
    join_token = "${SPIRE_AGENT_JOIN_TOKEN}"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data {}
    }

    # docker: the WorkloadAttestor that matches an individual container
    # calling this agent's Workload API socket against a registration
    # entry's selectors (docker:label:spiffe-workload:<value>) -- this is
    # what gives agentos, actor containers, etc. DISTINCT identities from
    # container labels alone, with zero manual certificate provisioning
    # per container (Phase 3/4's "narrowest selector, no shared identity"
    # principle).
    WorkloadAttestor "docker" {
        plugin_data {
            docker_socket_path = "unix:///var/run/docker.sock"
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
